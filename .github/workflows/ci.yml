name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Lint Python sources
        run: ruff check scripts tests

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  nextflow-validation:
    name: Nextflow validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.04.8"

      - name: Lint workflow
        run: nextflow lint pipeline-ase.nf

      - name: Validate configuration
        run: nextflow config . > /dev/null

      - name: Set up pipeline environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ase-environment.yaml
          cache-environment: true
          cache-downloads: true

      - name: Run end-to-end smoke test
        shell: bash -el {0}
        run: bash tests/run_smoke_test.sh
